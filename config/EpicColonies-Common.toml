[Values]
	#The counter which dictates how long after a citizen stops breaking a block, for the mining animation to stop (This only applies as a fallback if the animation state happens to get stuck)
	"Builder Mining Counter" = 24

[Fixes]
	#A fix for a bug related to citizens of a job under level 5 not accepting tools which are unbreakable (This is usually caused by mods which make all tools unbreakable, leading to the player unable to fulfill 'In Need <X> Item' requests for items which have no tier (Eg. Bow, shears, fishing rod, shield and flint & steel..))
	"Unbreakable Tools Fix" = false

	[Features."Experimental Features"]
		#A feature which allows archers to user daggers in close range to aggressors
		"Archer Dagger Melee" = false

	[Features."Facial Features"]
		#If true, citizens will no longer blink
		"Disable Citizen Blinking" = false
		#If true, citizens will no longer smile/frown/look-angry when happiness is above/below a certain point (The will remain neutral in expression)
		"Disable Citizen Facial Expressions" = false
		#If true, citizens eyes will no longer follow you when in looking range/angle
		"Disable Citizen Eyes Follow" = false

#Attack weights decide how often a mob picks each attack. They are relative, not percentages: chance = weight / total weight of all moves available at that moment (dodges included). A weight of 0 means never use it.
["Combat Attack Weights"]
	#(NEEDS RESTART TO TAKE EFFECT) Weight of EACH single-hit attack, for weapons with 4 single-hit attacks. All single hits together = this value x 4. Lower it so mobs with many single hits don't favor them over combos.
	"Combat Attack Weight Single X4" = 4
	#(NEEDS RESTART TO TAKE EFFECT) Weight of EACH single-hit attack, for weapons with 3 single-hit attacks. All single hits together = this value x 3.
	"Combat Attack Weight Single X3" = 6
	#(NEEDS RESTART TO TAKE EFFECT) Weight of EACH single-hit attack, for weapons with 2 single-hit attacks. All single hits together = this value x 2.
	"Combat Attack Weight Single X2" = 10
	#(NEEDS RESTART TO TAKE EFFECT) Weight of the single-hit attack, for weapons with only 1 single-hit attack.
	"Combat Attack Weight Single X1" = 12
	#(NEEDS RESTART TO TAKE EFFECT) Weight of the 2-hit combo (two attacks in a row).
	"Combat Attack Weight Double" = 22
	#(NEEDS RESTART TO TAKE EFFECT) Weight of the 3-hit combo (three attacks in a row).
	"Combat Attack Weight Triple" = 20
	#(NEEDS RESTART TO TAKE EFFECT) Weight of the 4-hit combo (four attacks in a row).
	"Combat Attack Weight Quad" = 16
	#(NEEDS RESTART TO TAKE EFFECT) Weight of the 5-hit combo (five attacks in a row).
	"Combat Attack Weight X5" = 14
	#(NEEDS RESTART TO TAKE EFFECT) Weight of the left dodge
	"Dodge Weight Left" = 40
	#(NEEDS RESTART TO TAKE EFFECT) Weight of the right dodge
	"Dodge Weight Right" = 40
	#(NEEDS RESTART TO TAKE EFFECT) Weight of the back dodge
	"Dodge Weight Back" = 40
